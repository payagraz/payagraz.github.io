<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Birthday Letter Invitation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            flex-direction: column;
        }
        #letter {
            cursor: pointer;
            padding: 20px 40px;
            background: #fff;
            border: 2px solid #333;
            font-size: 1.2em;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        #video {
            display: none;
            margin-top: 20px;
        }
        iframe {
            width: 80%;
            height: 400px;
            border: none;
        }
    </style>
</head>
<body>
    <div id="letter">Click to open your special invitation!</div>
    <div id="video">
        <!-- Replace the link below with your video embed -->
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        document.getElementById('letter').addEventListener('click', function() {
            const videoDiv = document.getElementById('video');
            const iframe = document.getElementById('videoFrame');
            iframe.src = 'YOUR_VIDEO_LINK_HERE'; // Insert your video link here
            videoDiv.style.display = 'block';
        });
    </script>
</body>
</html>
